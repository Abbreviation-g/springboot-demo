services:
  springboot-demo:
    image: springboot-demo:0.0.1
    container_name: springboot-demo
    ports:
      - "8763:8763"
    restart: always
# 这是一个 Docker Compose 配置文件，用于定义和管理 Docker 容器服务

# 文件格式说明：
# - 使用 YAML 格式，缩进使用空格（不能用 Tab）
# - 定义了一个名为 springboot-demo 的服务

# 服务配置详解：
# springboot-demo:          # 服务名称，可以自定义
#   image: springboot-demo:0.0.1   # 使用的 Docker 镜像名称和标签版本
#   container_name: springboot-demo # 容器的自定义名称（不是随机生成的）
#   ports:                         # 端口映射配置
#     - "8763:8763"                # 将主机的 8763 端口映射到容器的 8763 端口
#   restart: always                # 容器重启策略：总是自动重启
