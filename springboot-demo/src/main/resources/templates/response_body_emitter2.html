<body>
<input type="text" id="input_request_id" placeholder="请输入requestId">
<br>
<textarea id="input_text" rows="10" cols="100"></textarea>
<br>
<button id="startBtn" onclick="streamFetch()">开始</button>
<h2>接收的消息:</h2>
<div id="messages"></div>

<script>

    // 获取当前时间戳
    let startTimestamp = new Date().getTime();
    async function streamFetch() {
        try {
            let inputText = document.getElementById('input_text').value;
            inputText = inputText.trim();
            let requestId = document.getElementById('input_request_id').value;
            requestId = requestId.trim();
            let requestBody = {
            };
            if (!(inputText.length === 0)) {
                requestBody["input"] = inputText
            } else {
                requestBody["requestId"] = requestId
            }
            const response = await fetch('http://172.16.31.248:29188/ytj/inference/tts/stream', {
                method: 'POST', // 或 POST
                headers: {
                    'Content-Type': 'application/json',
                    'xtoken': 'df258510-bb77-400d-b4a8-a22acb13731f',
                    'appId': '535571678175365'
                },
                body: JSON.stringify(requestBody)
            });

            // 获取流读取器
            const reader = response.body.getReader();
            while (true) {
                const {done, value} = await reader.read();
                if (done) {
                    let endTimestamp = new Date().getTime();

                    console.log('流已结束', endTimestamp-startTimestamp);
                    break;
                }
                //TODO 进行数据处理

                // 把二进制流转换为二进制数组
                const bytes = new Uint8Array(value);
                console.log('二进制数组：', bytes);
                // await playPcmData(bytes)

                // const decoder = new TextDecoder('utf-8');
                // 把二进制流转成字符串
                // const chunk = decoder.decode(value, {stream: true});
                // console.log('后端返回的片段：', chunk);
                // 在这里渲染到页面：
                // document.getElementById('content').innerHTML += chunk;
            }

        } catch (err) {
            console.error('流接收失败', err);
        }
    }

    // 将 PCM Uint8Array 转换为 AudioBuffer
    async function pcmToAudioBuffer(pcmData, originalSampleRate, channels = 1) {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const float32Array = new Float32Array(pcmData.length / 2);

        // 将 Int16 格式的 PCM 数据转换为 Float32
        for (let i = 0; i < float32Array.length; i++) {
            const index = i * 2;
            // 从 Uint8Array 中读取两个字节，组成一个 Int16
            const int16 = (pcmData[index+1] << 8) | pcmData[index];
            // 将 Int16 (-32768 to 32767) 转换为 Float32 (-1.0 to 1.0)
            float32Array[i] = int16 / 32768.0;
        }

        // 创建一个新的 AudioBuffer，其采样率与浏览器上下文相同
        const audioBuffer = audioContext.createBuffer(channels, float32Array.length, audioContext.sampleRate);

        // 将转换后的 Float32 数据填入 AudioBuffer 的通道中
        audioBuffer.copyToChannel(float32Array, 0, 0);

        // 如果原始采样率与 AudioContext 的采样率不同，则需要进行重采样
        if (originalSampleRate !== audioContext.sampleRate) {
            console.log(`重采样: ${originalSampleRate}Hz -> ${audioContext.sampleRate}Hz`);
            // 这里需要一个更复杂的重采样算法，或者使用 Web Audio API 的 resample 功能
            // 最简单的方法是利用 OfflineAudioContext 进行高质量重采样
            const offlineCtx = new OfflineAudioContext(1, float32Array.length, originalSampleRate);
            const sourceBuffer = audioContext.createBuffer(channels, float32Array.length, originalSampleRate);
            sourceBuffer.copyToChannel(float32Array, 0, 0);

            const source = offlineCtx.createBufferSource();
            source.buffer = sourceBuffer;
            source.connect(offlineCtx.destination);
            source.start();

            const resampledBuffer = await offlineCtx.startRendering();
            return resampledBuffer;
        }

        return audioBuffer;
    }

    // 播放 AudioBuffer
    async function playAudioBuffer(audioBuffer) {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // 创建音频源
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;

        // 连接到扬声器
        source.connect(audioContext.destination);

        // 开始播放
        source.start();

        console.log("音频开始播放...");
    }

    // 主函数：接收 PCM 数据并播放
    async function playPcmData(bytes) {
        // 1. 获取 PCM 字节数组 (这里使用模拟数据)
        // const pcmByteArray = generateMockPcmData();
        console.log("接收到的 PCM 数据长度:", bytes.length);

        // 2. 将 PCM 数据转换为 AudioBuffer
        //    请确保传入正确的原始采样率 (例如 16000, 22050, 44100)
        const originalSampleRate = 24000;
        const audioBuffer = await pcmToAudioBuffer(bytes, originalSampleRate);

        // 3. 播放 AudioBuffer
        playAudioBuffer(audioBuffer);
    }
</script>
