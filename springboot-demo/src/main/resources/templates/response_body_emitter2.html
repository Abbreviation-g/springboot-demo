<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResponseBodyEmitter 一次性请求示例</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #messages {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .message {
            margin-bottom: 5px;
            padding: 5px;
            background-color: #fff;
            border-radius: 3px;
        }

        .status {
            color: green;
        }

        .error {
            color: orange; /* 区分连接错误和正常结束 */
        }
    </style>
</head>
<body>
<input type="text" id="input_request_id" placeholder="请输入requestId">
<br>
<textarea id="input_text" rows="10" cols="100"></textarea>
<br>
<button id="startBtn" onclick="streamFetch()">开始</button>
<h2>接收的消息:</h2>
<div id="messages"></div>

<script>
    // let eventSource = null;
    // const messagesDiv = document.getElementById('messages');
    // const startBtn = document.getElementById('startBtn');
    // const stopBtn = document.getElementById('stopBtn');

    // 获取当前时间戳
    let startTimestamp = new Date().getTime();
    async function streamFetch() {
        try {
            let inputText = document.getElementById('input_text').value;
            inputText = inputText.trim();
            let requestId = document.getElementById('input_request_id').value;
            requestId = requestId.trim();
            let requestBody = {
            };
            if (!(inputText.length === 0)) {
                requestBody["input"] = inputText
            } else {
                requestBody["requestId"] = requestId
            }
            const response = await fetch('http://127.0.0.1:29188/ytj/inference/tts/stream', {
                method: 'POST', // 或 POST
                headers: {
                    'Content-Type': 'application/json',
                    'xtoken': 'df258510-bb77-400d-b4a8-a22acb13731f',
                    'appId': '535571678175365'
                },
                body: JSON.stringify(requestBody)
            });

            // 获取流读取器
            const reader = response.body.getReader();
            while (true) {
                const {done, value} = await reader.read();
                if (done) {
                    let endTimestamp = new Date().getTime();

                    console.log('流已结束', endTimestamp-startTimestamp);
                    break;
                }
                //TODO 进行数据处理
                console.log('接收到的数据：', value)
                // 把二进制流转换为二进制数组
                // const bytes = new Uint8Array(value);
                // console.log('二进制数组：', bytes);
                // await playPcmData(bytes)

                // const decoder = new TextDecoder('utf-8');
                // 把二进制流转成字符串
                // const chunk = decoder.decode(value, {stream: true});
                // console.log('后端返回的片段：', chunk);
                // 在这里渲染到页面：
                // document.getElementById('content').innerHTML += chunk;
            }

        } catch (err) {
            console.error('流接收失败', err);
        }
    }

</script>
<script>


</script>
</body>
</html>
