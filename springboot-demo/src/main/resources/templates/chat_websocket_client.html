
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring SockJS 聊天室</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        .message-bubble { border-radius: 1rem; padding: 0.75rem; max-width: 70%; }
        .received { background-color: #e0e0e0; margin-left: 1rem; }
        .sent { background-color: #007bff; color: white; margin-right: 1rem; }
        .system { background-color: #6c757d; color: white; margin: 0.5rem auto; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <div class="container mx-auto p-6 flex-1 flex flex-col">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">💬 Spring SockJS 实时聊天室</h1>

        <div id="login" class="flex flex-col items-center mb-6">
            <input type="text" id="username" placeholder="请输入昵称" class="p-3 border rounded-lg w-64 mb-3">
            <button onclick="connect()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition">进入聊天</button>
        </div>

        <div id="chat" class="hidden flex-1 flex flex-col">
            <div id="messages" class="flex-1 overflow-y-auto p-4 bg-white rounded-lg shadow mb-4"></div>
            <div class="flex">
                <input type="text" id="message" placeholder="输入消息..." class="flex-1 p-3 border rounded-l-lg">
                <button onclick="sendMessage()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-3 rounded-r-lg transition">发送</button>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;

        function connect() {
            const username = document.getElementById('username').value.trim();
            if (!username) { alert('请输入昵称'); return; }

            const socket = new SockJS('http://localhost:8763/sockjs');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('chat').style.display = 'flex';

                // 订阅消息主题
                stompClient.subscribe('/topic/messages', function (message) {
                    displayMessage(JSON.parse(message.body));
                });

                // 发送用户加入事件
                stompClient.send("/app/chat.addUser", {}, JSON.stringify({ username }));
            });
        }

        function sendMessage() {
            const input = document.getElementById('message');
            const message = input.value.trim();
            if (!message) return;

            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify({ content: message }));
            input.value = '';
        }

        function displayMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'flex ' + (message.sender === 'SYSTEM' ? 'justify-center' : message.sender === '我' ? 'justify-end' : 'justify-start');
            div.innerHTML = `
                <div class="message-bubble ${message.sender === 'SYSTEM' ? 'system' : message.sender === '我' ? 'sent' : 'received'}">
                    <strong>${message.sender}</strong><br>
                    ${message.content}<br>
                    <small class="text-xs opacity-70">${message.timestamp}</small>
                </div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.addEventListener('beforeunload', () => {
            if (stompClient) stompClient.disconnect();
        });
    </script>
</body>
</html>
