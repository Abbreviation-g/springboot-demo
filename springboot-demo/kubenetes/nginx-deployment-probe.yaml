apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: namespace-0327
  labels:
    app: nginx
spec:
  replicas: 1  # 指定希望运行的 Pod 副本数量
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest # 使用最新的 nginx 镜像
          ports:
            - containerPort: 80 # 容器内的端口
          startupProbe: # 容器应用启动探针
            # httpGet:
            #  path: /index.html
            # tcpSocket:
            #   port: 80
            exec:
              command:
                - sh
                - -c
                - "sleep 3; echo success>/inited"
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          #livenessProbe: #
          #  httpGet:
          #    path: /started.html
          #    port: 80
          #  failureThreshold: 3
          #  periodSeconds: 10
          #  successThreshold: 1
          #  timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready.html
              port: 80
            failureThreshold: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          command:
            - nginx
            - -g
            - 'daemon off;'

---
# --- 分隔符，用于分隔多个资源定义

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: namespace-0327
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort # 与上面命令行方式一样，使用 NodePort 类型

