apiVersion: v1
kind: Service
metadata:
  name: jenkins-svc
  namespace: devops-test
  labels:
    app: jenkins-service
spec:
  type: NodePort
  ports:
    - name: httpport
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: jnlport
      port: 50000
      targetPort: 50000
      protocol: TCP
  selector:
    app: jenkins-server
