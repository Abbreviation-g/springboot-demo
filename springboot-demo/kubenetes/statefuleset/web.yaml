---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: namespace-0327
  labels:
    app: nginx
spec:
  ports:
    - port: 80
      name: web
  clusterIP: None
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web # statefulset的名字
  namespace: namespace-0327
spec:
  serviceName: "nginx" # 使用哪个service来管理DNS
  replicas: 2 # 副本数
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx # pod的标签
    spec:
      containers:
        - name: nginx
          image: nginx:1.7.9
          ports: # 容器内部要暴露的端口
            - containerPort: 80 # 具体暴露的端口
              name: web # 该端口配置的名字
          volumeMounts: # 加载数据卷
            - name: www # 加载哪个数据卷
              mountPath: /usr/share/nginx/html # 挂载到容器的哪个路径
  volumeClaimTemplates: # 数据卷的模板
    - metadata: # 数据卷的描述
        name: www # 数据卷的名称
        annotations: # 数据卷的注解
          volume.alpha.kubernetes.io/storage-class: anything
      spec: # 数据卷的规约
        accessModes: [ "ReadWriteOnce" ] # 访问模式
        resources:
          requests:
            storage: 1Gi # 需要的存储空间

