apiVersion: v1
kind: Pod
metadata:
  name: test-volume-pd
  namespace: namespace-0327
spec:
  containers:
    - image: nginx
      name: nginx-volume
      volumeMounts:
        - mountPath: /test-pd # 挂载到容器的哪个目录
          name: test-volume # 挂载哪个 volume
  volumes:
    - name: test-volume
      hostPath:
        path: /data # 节点中的目录
        type: Directory # 检查类型，在挂载前对挂载目录做什么检查操作，有多种选项，默认为空字符串，不做任何检查
