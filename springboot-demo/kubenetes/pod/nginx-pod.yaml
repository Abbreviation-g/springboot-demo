apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: namespace-0327
  labels:
    app: nginx
spec:
  containers:
    - name: nginx-container
      image: nginx:1.25-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "500m"
  restartPolicy: Always
  terminationGracePeriodSeconds: 30