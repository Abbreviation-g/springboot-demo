apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-path-pvc
  namespace: namespace-0327
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 200Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-local-path-pod
  namespace: namespace-0327
spec:
  containers:
    - name: busybox
      image: busybox:1.35
      command:
        - sh
        - -c
        - "echo 'Hello from local path!' > /data/hello.txt && sleep 3600"
      volumeMounts:
        - name: local-path-volume
          mountPath: /data
  volumes:
    - name: local-path-volume
      persistentVolumeClaim:
        claimName: local-path-pvc